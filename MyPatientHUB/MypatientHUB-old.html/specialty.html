<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MyPatientHUB - Find Doctor</title>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- Main CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

</head>


<body>

    <div class="specialty-page">


        <!-- =========================
             HEADER
        ========================== -->

        <header class="specialty-header">

            <div class="breadcrumb">

                <a href="dashboard.html">
                    <i class="fa-solid fa-house"></i>
                    <span>Home</span>
                </a>

                <i class="fa-solid fa-chevron-right"></i>

                <a href="finddoctor.html">
                    Find Doctor
                </a>

                <i class="fa-solid fa-chevron-right"></i>

                <span class="specialty-name">
                    Anesthesiology
                </span>

            </div>


            <div class="header-main">

                <div class="header-icon">
                    <i class="fa-solid fa-user-doctor"></i>
                </div>


                <div class="header-content">

                    <h1>
                        Anesthesiology
                    </h1>

                    <p>
                        Find doctors and schedule your appointment.
                    </p>

                </div>

            </div>

        </header>


        <!-- =========================
             SEARCH
        ========================== -->

        <section class="search-card">

            <div class="search-title">

                <h2>
                    Find a Doctor
                </h2>

                <p>
                    Search doctors and schedule an appointment.
                </p>

            </div>


            <div class="search-form">

                <div class="search-input">

                    <i class="fa-solid fa-user-doctor"></i>

                    <input
                        type="text"
                        placeholder="Search a doctor by name, specialty"
                    >

                </div>


                <div class="search-input">

                    <i class="fa-solid fa-location-dot"></i>

                    <input
                        type="text"
                        placeholder="Zip Code or Neighborhood"
                    >

                </div>


                <button
                    type="button"
                    class="search-button"
                >

                    <i class="fa-solid fa-magnifying-glass"></i>

                    Search

                </button>

            </div>

        </section>


        <!-- =========================
             MAP / LIST
        ========================== -->

        <section class="view-switch">

            <button
                type="button"
                class="view-btn active"
            >

                <i class="fa-solid fa-map-location-dot"></i>

                Map

            </button>


            <button
                type="button"
                class="view-btn"
            >

                <i class="fa-solid fa-list"></i>

                List

            </button>

        </section>


        <!-- =========================
             FILTERS
        ========================== -->

        <section class="filter-card">


            <!-- Location -->

            <div class="location-fields">

                <input
                    type="text"
                    class="filter-input"
                    placeholder="Primary Care"
                >

                <input
                    type="text"
                    class="filter-input"
                    placeholder="Zip code or Neighborhood"
                >

            </div>


            <!-- Filter By -->

            <div class="filter-block">

                <h2 class="filter-title">
                    Filter By
                </h2>


                <div class="filter-grid">

                    <button
                        type="button"
                        class="select-box"
                    >

                        <span>
                            Specialty
                        </span>

                        <i class="fa-solid fa-chevron-down"></i>

                    </button>


                    <button
                        type="button"
                        class="select-box"
                    >

                        <span>
                            Gender
                        </span>

                        <i class="fa-solid fa-chevron-down"></i>

                    </button>


                    <button
                        type="button"
                        class="select-box"
                    >

                        <span>
                            Condition
                        </span>

                        <i class="fa-solid fa-chevron-down"></i>

                    </button>


                    <button
                        type="button"
                        class="select-box"
                    >

                        <span>
                            Languages
                        </span>

                        <i class="fa-solid fa-chevron-down"></i>

                    </button>

                </div>

            </div>


            <!-- Providers Who Treat -->

            <div class="filter-block">

                <h3 class="filter-section-title">
                    Providers Who Treat
                </h3>


                <div class="check-list">

                    <label class="check-item">

                        <input
                            type="checkbox"
                            name="age"
                            value="all"
                        >

                        <span>
                            All Ages
                        </span>

                    </label>


                    <label class="check-item">

                        <input
                            type="checkbox"
                            name="age"
                            value="children"
                        >

                        <span>
                            Children
                        </span>

                    </label>


                    <label class="check-item">

                        <input
                            type="checkbox"
                            name="age"
                            value="adults"
                        >

                        <span>
                            Adults
                        </span>

                    </label>

                </div>

            </div>


            <!-- View Only -->

            <div class="filter-block">

                <h3 class="filter-section-title">
                    View Only
                </h3>


                <div class="check-list">

                    <label class="check-item">

                        <input
                            type="checkbox"
                            name="view"
                            value="online"
                        >

                        <span>
                            Online Scheduling
                        </span>

                    </label>


                    <label class="check-item">

                        <input
                            type="checkbox"
                            name="view"
                            value="primary"
                        >

                        <span>
                            Primary Care
                        </span>

                    </label>

                </div>

            </div>

        </section>


        <!-- =========================
             SORT
        ========================== -->

        <section class="sort-section">

            <div class="sort-title">

                <span>
                    Sort By
                </span>

            </div>


            <button
                type="button"
                class="sort-button active"
            >

                <i class="fa-solid fa-calendar-check"></i>

                Next Available

            </button>


            <button
                type="button"
                class="sort-button"
            >

                <i class="fa-solid fa-location-arrow"></i>

                Distance

            </button>

        </section>


        <!-- =========================
             MAP
        ========================== -->

        <section class="map-section">

            <div class="map-header">

                <div class="map-type">

                    <button
                        type="button"
                        class="map-type-btn active"
                    >

                        <i class="fa-solid fa-map"></i>

                        Map

                    </button>


                    <button
                        type="button"
                        class="map-type-btn"
                    >

                        <i class="fa-solid fa-satellite"></i>

                        Satellite

                    </button>

                </div>

            </div>


            <!-- Leaflet Map -->

            <div
                id="doctor-map"
                class="doctor-map"
            ></div>

        </section>


        <!-- =========================
             FOOTER
        ========================== -->

        <footer class="specialty-footer">


            <div class="footer-logo">

                <i class="fa-solid fa-heart-pulse"></i>

                MyPatientHUB

            </div>


            <p>

                © 2026, made with

                <i class="fa-solid fa-heart"></i>

                by
                <strong>
                    MyPatientHUB
                </strong>

                <br>

                for a better web.

            </p>


            <div class="footer-links">

                <a href="dashboard.html">
                    MyPatientHUB
                </a>

                <a href="#">
                    About Us
                </a>

                <a href="#">
                    Blog
                </a>

            </div>


            <button
                type="button"
                class="back-top"
            >

                <i class="fa-solid fa-chevron-up"></i>

            </button>


        </footer>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <!-- Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Main JavaScript -->
    <script src="script.js"></script>

</body>

</html>
